name: Release
on:
  push:
    branches:
      - src
  schedule:
    # Every day, to pick up the latest wgsl-analyzer repo changes.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy MDBook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.2.3"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - run: bundle install && bundle exec jekyll build

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: mdbook@0.5

      - name: Clone the wgsl-analyzer repository
        run: git clone --depth 1 https://github.com/wgsl-analyzer/wgsl-analyzer

      - name: Build generated.md files
        run: cd wgsl-analyzer && cargo xtask codegen

      - name: Run mdbook
        run: cd wgsl-analyzer/docs/book && mdbook build

      - name: Include mdbook output
        run: mv wgsl-analyzer/docs/book/book _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: _site
          force_orphan: true
